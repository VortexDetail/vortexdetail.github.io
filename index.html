<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex Detailing | Auto Kosmetyka i Detailing Wnętrz Jasło</title>
<meta name="description" content="Profesjonalny detailing wnętrz samochodowych w Jaśle. Oferujemy dokładne czyszczenie i konserwację plastików, pranie tapicerki oraz usuwanie uciążliwego brudu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0a0a;
    --panel:#141414;
    --white:#f6f6f4;
    --gray:#8f8f8a;
    --line:#2a2a28;
    --line-light:#dcdcd7;
    --display:'Anton', sans-serif;
    --mono:'JetBrains Mono', monospace;
    --body:'Inter', sans-serif;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  body{
    margin:0;
    background:var(--black);
    color:var(--white);
    font-family:var(--body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; }
  ::selection{ background:var(--white); color:var(--black); }

  :focus-visible{
    outline:2px solid var(--white);
    outline-offset:3px;
  }

  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:0 24px;
  }

  /* ---------- NAV ---------- */
  header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(10,10,10,0.85);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  nav.wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:72px;
  }
  .logo{
    font-family:var(--display);
    font-size:22px;
    letter-spacing:2px;
    text-decoration:none;
    display:flex;
    align-items:center;
  }
  .logo-img{
    height:34px;
    width:auto;
    display:block;
  }
  .nav-links{
    display:flex;
    gap:32px;
    list-style:none;
    margin:0; padding:0;
  }
  .nav-links a{
    text-decoration:none;
    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gray);
    transition:color .2s;
    padding:4px 0;
    border-bottom:1px solid transparent;
  }
  .nav-links a:hover, .nav-links a:focus-visible{
    color:var(--white);
    border-bottom-color:var(--white);
  }
  .burger{
    display:none;
    background:none;
    border:1px solid var(--line);
    width:40px;height:40px;
    color:var(--white);
    font-size:18px;
    cursor:pointer;
  }
  @media (max-width:760px){
    .nav-links{
      position:absolute;
      top:72px; left:0; right:0;
      background:var(--black);
      border-bottom:1px solid var(--line);
      flex-direction:column;
      gap:0;
      max-height:0;
      overflow:hidden;
      transition:max-height .25s ease;
    }
    .nav-links.open{ max-height:260px; }
    .nav-links a{
      display:block;
      padding:16px 24px;
      border-bottom:1px solid var(--line);
    }
    .burger{ display:block; }
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:88vh;
    display:flex;
    align-items:center;
    overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .vortex-bg{
    position:absolute;
    top:50%; left:50%;
    width:900px; height:900px;
    transform:translate(-50%,-50%);
    background:conic-gradient(from 0deg,
      #1a1a1a, #050505 10%, #2b2b2b 20%, #050505 35%,
      #232323 50%, #050505 65%, #2b2b2b 80%, #050505 92%, #1a1a1a);
    border-radius:50%;
    opacity:0.55;
    filter:blur(2px);
    animation:spin 40s linear infinite;
  }
  @keyframes spin{ to{ transform:translate(-50%,-50%) rotate(360deg); } }
  .hero::after{
    content:'';
    position:absolute; inset:0;
    background:radial-gradient(circle at center, rgba(10,10,10,0) 0%, var(--black) 72%);
  }
  .hero-content{
    position:relative;
    z-index:2;
    max-width:680px;
    padding:0 24px;
    margin:0 auto;
    text-align:center;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:4px;
    color:var(--gray);
    text-transform:uppercase;
    margin-bottom:18px;
  }
  h1.brand{
    font-family:var(--display);
    font-size:clamp(56px, 14vw, 120px);
    line-height:0.9;
    letter-spacing:2px;
    margin:0 0 20px;
  }
  .tagline{
    font-size:17px;
    color:#cfcfca;
    max-width:480px;
    margin:0 auto 36px;
  }
  .cta{
    display:inline-block;
    border:1px solid var(--white);
    color:var(--white);
    text-decoration:none;
    padding:14px 32px;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    transition:background .2s, color .2s;
  }
  .cta:hover, .cta:focus-visible{
    background:var(--white);
    color:var(--black);
  }

  .hero-logo{
    display:block;
    width:min(85vw, 480px);
    height:auto;
    margin:0 auto 28px;
  }
  .process-strip{
    margin-top:56px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gray);
    flex-wrap:wrap;
  }
  .process-strip span{
    position:relative;
    padding-right:18px;
  }
  .process-strip span:not(:last-child)::after{
    content:'';
    position:absolute;
    right:0; top:50%;
    width:1px; height:12px;
    background:var(--line);
    transform:translateY(-50%);
  }
  @media (max-width:500px){
    .process-strip{ gap:14px; margin-top:40px; }
    .process-strip span{ padding-right:14px; }
  }

  /* ---------- SECTION GENERIC ---------- */
  section{
    padding:110px 0;
    border-bottom:1px solid var(--line);
  }
  .section-head{
    margin-bottom:56px;
  }
  h2{
    font-family:var(--display);
    font-size:clamp(34px, 6vw, 56px);
    letter-spacing:1px;
    margin:0;
    text-transform:uppercase;
  }

  /* ---------- O MNIE ---------- */
  .about-grid{
    display:grid;
    grid-template-columns:1fr 1.4fr;
    gap:60px;
    align-items:start;
  }
  @media (max-width:760px){
    .about-grid{ grid-template-columns:1fr; gap:32px; }
  }
  .about-text p{
    font-size:16px;
    color:#d6d6d2;
    max-width:520px;
  }
  .about-text p + p{ margin-top:18px; }

  /* ---------- CENNIK ---------- */
  .packages{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:60px;
  }
  @media (max-width:760px){
    .packages{ grid-template-columns:1fr; }
  }
  .package{
    background:var(--black);
    padding:40px;
  }
  .package.premium{
    background:var(--white);
    color:var(--black);
  }
  .package-name{
